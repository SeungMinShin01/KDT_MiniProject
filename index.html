<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세탁도우미</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <a href="index.html">
            <div class="logo">
              <img class="main-logo" src="./FE/assets/mainlogo.png" />
            </div>
            <div>
              <h1 class="logo-title">Laundry Helper</h1>
              <p class="logo-subtitle">세탁 도우미</p>
            </div></a
          >
        </div>

        <nav class="nav">
          <a href="./FE/washingGuide/washingGuide.html">의류별 세탁법</a>
          <a href="./FE/washingSymbol/symbol.html">세탁 기호</a>
          <a href="./FE/dryingGuide/dryingGuide.html">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
      <div class="main-top">
        <h4 class="top-top">똑똑한 세탁 생활의 시작</h4>
        <h2 class="top-title">세탁 도우미</h2>
        <div class="top-bottom">
          의류별 세탁법부터 얼룩 제거, 건조 방법까지<br />
          모든 세탁 정보를 한 곳에서 확인하세요!
        </div>
        <div class="main-inner">
          <div class="menu-card">
            <a href="./FE/washingGuide/washingGuide.html" class="service-card">
              <img
                class="service-icon"
                src="./FE/assets/main/의류별 세탁법.png"
              />

              <div class="service-content">
                <h3 class="service-title">의류별 세탁법</h3>

                <p>
                  소재와 종류에 맞는 세탁<br />
                  방법을 확인하세요
                </p>
              </div>
            </a>

            <a href="./FE/washingSymbol/symbol.html" class="service-card">
              <img class="service-icon" src="./FE/assets/main/세탁 기호.png" />

              <div class="service-content">
                <h3 class="service-title">세탁 기호</h3>

                <p>
                  세탁 라벨의 기호 뜻을 <br />
                  쉽게 알아보세요!
                </p>
              </div>
            </a>

            <a href="./FE/dryingGuide/dryingGuide.html" class="service-card">
              <img class="service-icon" src="./FE/assets/main/건조 방법.png" />

              <div class="service-content">
                <h3 class="service-title">건조 방법</h3>

                <p>의류에 맞는 건조 방법으로<br />옷감을 보호하세요</p>
              </div>
            </a>
          </div>
          <div class="main-bottom">
            <img class="tip-icon" src="./FE/assets/main/전구.png" />

            <div class="tip-content">
              <h4 class="tip-title">오늘의 세탁 꿀팁</h4>

              <p>
                흰 옷은 단독 세탁이 기본! 다른 색상의 옷과 함께 세탁하면 이염이
                발생할 수 있어요.
              </p>
            </div>
            <p class="arrow">></p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
