<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <div class="logo">1</div>
          <div>
            <h1 class="logo-title">Laundry Helper</h1>
            <p class="logo-subtitle">세탁 도우미</p>
          </div>
        </div>

        <nav class="nav">
          <a href="#">의류별 세탁법</a>
          <a href="#">세탁 기호</a>
          <a href="#">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
      <div class="main-top">
        <h4 class="top-top">똑똑한 세탁 생활의 시작</h4>
        <h2 class="top-title">세탁 도우미</h2>
        <div class="top-bottom">
          의류별 세탁법부터 얼룩 제거, 건조 방법까지<br />
          모든 세탁 정보를 한 곳에서 확인하세요!
        </div>
      </div>
      <div class = "main-inner">
        <div class = "input-wrap">
          <input
            type="search"
            class="search-input"
            placeholder="검색어를 입력하세요 (예: 니트, 커피 얼룩)"
          />
          <button class="search" type="button">
            <svg
              xmlns="http://w3.org"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="#2563EB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        <div class="menu-card">
          <a href="#" class="service-card">
            <img src="../assets/main/의류별 세탁법.png" alt="" class="service-icon"/>

            <div class="service-content">
              <h3 class="service-title">의류별 세탁법</h3>

              <p>소재와 종류에 맞는 세탁<br/> 방법을 확인하세요</p>
            </div>
          </a>

          <a href="#" class="service-card">
            <img src="../assets/main/세탁 기호.png" alt="" class="service-icon"/>

            <div class="service-content">
              <h3 class="service-title">세탁 기호</h3>

              <p> 세탁 라벨의 기호 뜻을<br/> 쉽게 알아보세요!</p>
            </div>
          </a>

          <a href="#" class="service-card">
            <img src="../assets/main/건조 방법.png" alt=" "class="service-icon"/>

            <div class="service-content">
              <h3 class="service-title">건조 방법</h3>

              <p>의류에 맞는 건조 방법으로<br/>옷감을 보호하세요</p>
            </div>
          </a>
        <div class="main-bottom">
          <img src="../assets/main/전구.png" alt="" class="tip-icon"/>

          <div class="tip-content">
            <h4 class="tip-title">오늘의 세탁 꿀팁</h4>

            <p>흰 옷은 단독 세탁이 기본! 다른 색상의 옷과 함께 세탁하면 이염이 발생할 수 있어요.</p>
          </div>
        </div>
      </div>
    </div>
    <!-- 푸터 영역 -->
    <div id="footer">
      <div class="footer-inner">
        1
        <!-- 추후 작업 -->
      </div>
    </div>
  </body>
</html>
