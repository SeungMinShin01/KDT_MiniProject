<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="dryingGuide.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <div class="logo">1</div>
          <div>
            <h1 class="logo-title">Laundry Helper</h1>
            <p class="logo-subtitle">세탁 도우미</p>
          </div>
        </div>

        <nav class="nav">
          <a href="#">의류별 세탁법</a>
          <a href="#">세탁 기호</a>
          <a href="#">얼룩 제거</a>
          <a href="#">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
        <!-- 건조 페이지 시작-->
        <div class = "dryingGuide">
            <div id = "dryTop">
                <h2>의류별 세탁법</h2>
                <p>소재와 종류에 맞는 세탁방법을 확인하세요.</p>
            </div>
        <!-- 건조 페이지 본문 -->
        <div class = "dry-Content">
            <!-- 왼쪽영역-->
            <div class= "dry-Left">
                <!--의류 종류 이미지-->
                <div id = "clothes-card">
                    <img src="/FE/assets/의류/img_흰티셔츠.png">
                        <h3>흰티셔츠<span>(면)</span></h3>
                </div>
                <!--세탁 기호 : 추후에 JS로 바꿀것-->
                <div id= "symbol-list">

                        <div class="symbol-card">
                            <img src="/FE/assets/img_세탁기호 3.png" alt="물세탁 가능">
                        </div>

                        <div class="symbol-card">
                            <img src="/FE/assets/img_세탁기호 9.png" alt="그늘 건조">
                        </div>

                        <div class="symbol-card">
                            <img src="/FE/assets/img_세탁기호 6.png" alt="표백 가능">
                        </div>

                        <div class="symbol-card">
                            <img src="/FE/assets/img_세탁기호 7.png" alt="건조기 가능">
                        </div>

                </div> <!--세탁기호 end-->

            </div> <!--왼쪽영역 end-->
            <!--오른쪽 영역 start-->
            <div class ="dry-right">
                <div id = "dry-info">
                    <h2>권장 건조 방법</h2>
                    <h2>그늘 건조</h2>
                    <p>직사광선을 피해 통풍이 잘 되는<br/>
                        그늘에서 자연 건조하는 것이 좋아요. </p>
                </div><!--건조정보 end-->
                <div id = "drt-tip">
                    <h2>TIP</h2>
                        <p>얼룩은 시간이 지날수록 제거가 어려워요.<br>
                            발견 즉시 빠르게 대처하는 것이 중요해요!
                        </p>

                        <p>
                            뜨거운 물은 얼룩을 고착시킬 수 있으니<br>
                            찬물 또는 미지근한 물을 사용하세요.
                        </p>
                </div> <!--TIP end-->
            </div> <!--오른쪽 영역 end-->

        </div> <!--건조페이지 end-->

    </div>
    <!-- 푸터 영역 -->
    <div id="footer">
      <div class="footer-inner">
        1
        <!-- 추후 작업 -->
      </div>
    </div>
  </body>
</html>
