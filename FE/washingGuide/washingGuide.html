<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세탁 방법</title>
    <link rel="stylesheet" href="washingGuide.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <a href="../../index.html">
            <div class="logo">
              <img class="main_logo" src="../assets/mainlogo.png" />
            </div>
            <div>
              <h1 class="logo-title">Laundry Helper</h1>
              <p class="logo-subtitle">세탁 도우미</p>
            </div>
          </a>
        </div>

        <nav class="nav">
          <a href="washingGuide.html">의류별 세탁법</a>
          <a href="../washingSymbol/symbol.html">세탁 기호</a>
          <a href="../dryingGuide/dryingGuide.html">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
      <div class="main-inner">
        <div class="left-main">
          <div class="main-title">
            <h2>의류별 세탁법</h2>
            <div>소재와 종류에 맞는 세탁 방법을 확인하세요.</div>
          </div>
          <div class="main-topMenu">
            <ol class="btn-list">
              <li><button onclick="printClothesCard('0')">전체</button></li>
              <li><button onclick="printClothesCard('1')">상의</button></li>
              <li><button onclick="printClothesCard('2')">하의</button></li>
              <li><button onclick="printClothesCard('3')">외투</button></li>
              <li><button onclick="printClothesCard('4')">양말</button></li>
              <li><button onclick="printClothesCard('5')">속옷</button></li>
              <li><button onclick="printClothesCard('6')">기타</button></li>
            </ol>
            <div>
              <div class="input-wrap">
                <input
                  type="text"
                  class="main-searchBox"
                  placeholder="의류명을 검색하세요."
                />
                <button
                  class="search-btn"
                  type="button"
                  onclick="searchClick()"
                >
                  <svg
                    xmlns="http://w3.org"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="#2563EB"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    onclick="searchClick()"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <!-- 하단 카드 영역 -->
          <div class="cloth-grid">
            <div class="cloth-card">
              <div><img src="../assets/의류/img_흰티셔츠.png" /></div>

              <h4>흰 티셔츠<span>(면)</span></h4>
              <div class="badge-wrap">
                <span class="badge badge-green">30℃ 이하</span>
                <span class="badge badge-blue">일반 세탁</span>
              </div>
            </div>
          </div>
        </div>

        <div class="right-main">
          <h4 class="title2">상품 카드를 클릭하면 상세 정보가 출력됩니다.</h4>
        </div>
      </div>
    </div>
    <script src="../data/data.js"></script>
    <script src="washingGuide.js"></script>
  </body>
</html>
