<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="washingGuide.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <div class="logo">1</div>
          <div>
            <h1 class="logo-title">Laundry Helper</h1>
            <p class="logo-subtitle">세탁 도우미</p>
          </div>
        </div>

        <nav class="nav">
          <a href="#">의류별 세탁법</a>
          <a href="#">세탁 기호</a>
          <a href="#">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
      <div class="main-title">
        <h2>의류별 세탁법</h2>
        <div>소재와 종류에 맞는 세탁 방법을 확인하세요.</div>
      </div>
      <div class="main-inner">
        <div class="left-main">
          <div class="main-topMenu">
            <ol class="btn-list">
              <li><button>전체</button></li>
              <li><button>상의</button></li>
              <li><button>하의</button></li>
              <li><button>외투</button></li>
              <li><button>속옷</button></li>
              <li><button>기타</button></li>
            </ol>
            <div>
              <div class="input-wrap">
                <input
                  type="text"
                  class="main-searchBox"
                  placeholder="의류명을 검색하세요.   "
                />
                <button class="search-btn" type="button">
                  <svg
                    xmlns="http://w3.org"
                    viewBox="0 0 24 24"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="#2563EB"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <!-- 하단 카드 영역 -->
        <div class="right-main">12</div>
      </div>
    </div>
    <!-- 푸터 영역 -->
    <div id="footer">
      <div class="footer-inner">
        1
        <!-- 추후 작업 -->
      </div>
    </div>
