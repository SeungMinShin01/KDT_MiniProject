<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Title</title>
    <link rel="stylesheet" href="symbol.css" />
  </head>

  <body>
    <!-- 헤더 영역 -->
    <div id="header">
      <div id="header-inner">
        <div class="logo-wrap">
          <div class="logo">
            <img class="main_logo" src="/FE/assets/mainlogo.png" />
          </div>
          <div>
            <h1 class="logo-title">Laundry Helper</h1>
            <p class="logo-subtitle">세탁 도우미</p>
          </div>
        </div>

        <nav class="nav">
          <a href="#">의류별 세탁법</a>
          <a href="#">세탁 기호</a>
          <a href="#">건조 방법</a>
        </nav>
      </div>
    </div>
    <!-- 메인 영역 -->
    <div id="main">
      <!-- 작업 영역 -->
      <div class="head-wrap">
        <div>
          <h3 class="p3main">세탁기호</h3>
          <p>의류 라벨에 표시된 세탁기호와 의미를 확인하세요.</p>
        </div>
        <div class="search-wrap">
          <input
            type="text"
            class="main-searchBox"
            placeholder="기호명을 검색하세요."
          />
          <button class="search-btn" type="button">
            <svg
              xmlns="http://w3.org"
              viewBox="0 0 24 24"
              width="24"
              height="24"
              fill="none"
              stroke="#2563EB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="main-wrap">
        <ul class="main-side">
          <li><a class="side1" href="#">전체</a></li>
          <li><a href="#">물세탁</a></li>
          <li><a href="#">표백</a></li>
          <li><a href="#">건조</a></li>
          <li><a href="#">다림질</a></li>
          <li><a href="#">드라이클리닝</a></li>
          <li><a href="#">기타</a></li>
        </ul>

        <div class="symbol-wrap">
          <div><img src="/FE/assets/세탁기호/img_세탁기호 1.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 2.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 3.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 4.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 5.png" /></div>

          <div><img src="/FE/assets/세탁기호/img_세탁기호 6.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 7.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 8.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 9.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 10.png" /></div>

          <div><img src="/FE/assets/세탁기호/img_세탁기호 11.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 12.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 13.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 14.png" /></div>
          <div><img src="/FE/assets/세탁기호/img_세탁기호 15.png" /></div>
        </div>
      </div>
    </div>

    <div>
      <div><img src="/FE/assets/세탁기호/img_세탁기호 3.png"></div>
      <div>
        <h3>물세탁 가능</h3>
        <p>
          세탁기 또는 손세탁으로 물세탁할 수 있습니다. <br/>
          기호 안의 숫자는 사용할 수 있는 최대 물 온도를 의미합니다.
        </p>
      </div>
      <div> 예시 </div>
      <div><img src="/FE/assets/세탁기호/예시기호1 1.png"></div>
      <div><img src="/FE/assets/세탁기호/예시기호1 2.png"></div>
    </div>

  </div>
  <!-- 푸터 영역 -->
  <div id="footer">
    <div class="footer-inner">
      
    </div>
  </div>

</html>
